<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara's Food Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ledger-bg: #1f2e23;
    --ledger-bg-alt: #263a2c;
    --paper: #f3efdf;
    --paper-shadow: #d9d3ba;
    --ink: #211f1a;
    --ink-soft: #514c40;
    --gold: #c9922b;
    --teal: #3f6b63;
    --error: #b54b3a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--ledger-bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03) 0%, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(255,255,255,0.02) 0%, transparent 45%);
    color: var(--paper);
    min-height: 100vh;
  }

  header {
    padding: 2.5rem 1.5rem 1.5rem;
    text-align: center;
    border-bottom: 1px solid rgba(243,239,223,0.15);
  }

  header .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  header h1 {
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0;
    letter-spacing: 0.01em;
  }

  header p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: rgba(243,239,223,0.55);
    margin-top: 0.6rem;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
    gap: 2rem;
    max-width: 1100px;
    margin: 2rem auto;
    padding: 0 1.5rem 3rem;
    align-items: start;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .ledger-panel {
      position: fixed;
      top: 0; right: 0;
      height: 100vh;
      width: min(88vw, 380px);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 50;
      overflow-y: auto;
      box-shadow: -8px 0 24px rgba(0,0,0,0.35);
    }
    .ledger-panel.open { transform: translateX(0); }
    .ledger-tab {
      display: flex;
    }
  }

  /* --- Entry card (index card / receipt aesthetic) --- */
  .entry-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 2rem;
    box-shadow: 0 12px 0 -6px var(--paper-shadow), 0 20px 30px rgba(0,0,0,0.25);
    position: relative;
  }

  .entry-card::before {
    content: "";
    position: absolute;
    top: 0; left: 2rem; right: 2rem;
    height: 1px;
    background: repeating-linear-gradient(to right, var(--ink-soft) 0 6px, transparent 6px 12px);
    opacity: 0.25;
  }

  .entry-card h2 {
    font-family: 'Zilla Slab', serif;
    font-size: 1.4rem;
    margin: 0 0 0.25rem;
  }

  .entry-card .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-bottom: 1.75rem;
  }

  .field {
    margin-bottom: 1.25rem;
  }

  .field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }

  .field input {
    width: 100%;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 1rem;
    padding: 0.7rem 0.8rem;
    border: 1.5px solid rgba(33,31,26,0.2);
    border-radius: 3px;
    background: #fffdf7;
    color: var(--ink);
  }

  .field input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(63,107,99,0.15);
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .submit-btn {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.9rem;
    border: none;
    border-radius: 3px;
    background: var(--teal);
    color: #f3efdf;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .submit-btn:hover { background: #365a53; }
  .submit-btn:active { transform: translateY(1px); }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  .status-msg {
    margin-top: 1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    min-height: 1.2em;
  }
  .status-msg.ok { color: var(--teal); }
  .status-msg.err { color: var(--error); }

  .config-note {
    margin-top: 2rem;
    padding: 0.9rem 1rem;
    background: rgba(181,75,58,0.08);
    border: 1px solid rgba(181,75,58,0.35);
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--error);
    line-height: 1.5;
  }

  /* --- Ledger sidebar --- */
  .ledger-panel {
    background: var(--ledger-bg-alt);
    border: 1px solid rgba(243,239,223,0.12);
    border-radius: 4px;
    padding: 1.5rem 1.25rem;
    max-height: 80vh;
    overflow-y: auto;
  }

  .ledger-panel h2 {
    font-family: 'Zilla Slab', serif;
    font-size: 1.2rem;
    margin: 0 0 0.2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ledger-panel .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: rgba(243,239,223,0.5);
    margin-bottom: 1.25rem;
  }

  .close-ledger {
    display: none;
    background: none;
    border: none;
    color: var(--paper);
    font-size: 1.3rem;
    cursor: pointer;
    line-height: 1;
  }

  @media (max-width: 860px) {
    .close-ledger { display: block; }
  }

  .day-group {
    margin-bottom: 1.5rem;
  }

  .day-stamp {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--gold);
    color: #21201a;
    padding: 0.4rem 0.7rem;
    border-radius: 2px;
    margin-bottom: 0.6rem;
    border: none;
    cursor: pointer;
    font-weight: 600;
}

    .day-stamp:hover { background: #d9a13a; }

    .day-stamp .chevron {
    display: inline-block;
    transition: transform 0.2s ease;
    font-size: 0.7rem;
}

    .day-stamp.expanded .chevron {
    transform: rotate(90deg);
}

    .day-entries {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.25s ease;
}

    .day-entries.expanded {
    max-height: 1000px;
}



  .day-checkbox {
    display: flex;
    align-items: center;
}

  .day-checkbox input {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--teal);
}

  .day-stamp .day-label {
    flex: 1;
    cursor: pointer;
}

  .calc-macros-btn {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.7rem;
    border: none;
    border-radius: 3px;
    background: var(--teal);
    color: #f3efdf;
    cursor: pointer;
    margin-bottom: 1rem;
}

  .calc-macros-btn:hover { background: #365a53; }
  .calc-macros-btn:disabled { opacity: 0.6; cursor: default; }

  .macros-total {
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    padding: 0.75rem 1rem;
    margin-bottom: 1.25rem;
}

  .macro-row {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    padding: 0.2rem 0;
}

  .macros-missing {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--gold);
    margin-bottom: 1.25rem;
}

  .stub {
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    padding: 0.65rem 0.8rem;
    margin-bottom: 0.5rem;
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
  }

  .stub::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -0.28rem;
    height: 1px;
    background: repeating-linear-gradient(to right, rgba(33,31,26,0.25) 0 4px, transparent 4px 8px);
  }

  .stub:last-child::after { display: none; }

  .stub .food-name {
    font-weight: 500;
    font-size: 0.9rem;
  }

  .stub .qty {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .empty-state, .loading-state {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: rgba(243,239,223,0.5);
    padding: 1rem 0.2rem;
  }

  .ledger-tab {
    display: none;
    position: fixed;
    top: 1.2rem;
    right: 1.2rem;
    z-index: 51;
    background: var(--gold);
    color: #21201a;
    border: none;
    padding: 0.6rem 0.9rem;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 40;
  }
  .backdrop.open { display: block; }
</style>
</head>
<body>

<header>
  <h1>Zara's Daily Food Entry Diary</h1>
</header>

<button class="ledger-tab" id="ledgerTab" onclick="toggleLedger(true)">📖 Ledger</button>
<div class="backdrop" id="backdrop" onclick="toggleLedger(false)"></div>

<div class="layout">

  <div class="entry-card">
    <h2>New entry</h2>
    <div class="sub">FOOD &nbsp;·&nbsp; AMOUNT &nbsp;·&nbsp; DATE</div>

    <form id="entryForm">
      <div class="field">
        <label for="food">Food</label>
        <input type="text" id="food" required>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" step="any" min="0" required>
        </div>
        <div class="field">
          <label for="unit">Unit</label>
          <input type="text" id="unit" required>
        </div>
      </div>

      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Add to diary</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>

    <div class="config-note" id="configNote">
      ⚠ Not connected yet — open this file and set <code>API_URL</code> near the bottom to your deployed Google Apps Script Web App URL.
    </div>
  </div>

  <div class="ledger-panel" id="ledgerPanel">
    <h2>Log <button class="close-ledger" onclick="toggleLedger(false)">✕</button></h2>
    <div class="sub">previous days, most recent first</div>
    <button type="button" class="calc-macros-btn" id="calcMacrosBtn">Calculate Macros</button>
    <div id="macrosResult"></div>
    <div id="ledgerContent">
      <div class="loading-state">Loading entries…</div>
    </div>
  </div>

</div>

<script>
  // ==========================================================
  // SET THIS to your deployed Google Apps Script Web App URL,
  // e.g. "https://script.google.com/macros/s/AKfycb.../exec"
  // ==========================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbwZD5pUzk01h51jsuFEyMFqDghbvUzkfCrRMbUHzXVc-YIvZBYzjYu8tSVgvHU0FiAyig/exec";

  const form = document.getElementById('entryForm');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');
  const dateInput = document.getElementById('date');
  const configNote = document.getElementById('configNote');
  const ledgerContent = document.getElementById('ledgerContent');
  const ledgerPanel = document.getElementById('ledgerPanel');
  const ledgerTab = document.getElementById('ledgerTab');
  const backdrop = document.getElementById('backdrop');

  // Default the date field to today (local time, not UTC)
  function todayString() {
    const d = new Date();
    const offset = d.getTimezoneOffset();
    const local = new Date(d.getTime() - offset * 60000);
    return local.toISOString().slice(0, 10);
  }
  dateInput.value = todayString();

  if (API_URL) {
    configNote.style.display = 'none';
  }

  function toggleLedger(open) {
    ledgerPanel.classList.toggle('open', open);
    backdrop.classList.toggle('open', open);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!API_URL) {
      statusMsg.textContent = 'Set API_URL in the script before submitting.';
      statusMsg.className = 'status-msg err';
      return;
    }

    const payload = {
      date: dateInput.value,
      food: document.getElementById('food').value.trim(),
      quantity: document.getElementById('quantity').value,
      unit: document.getElementById('unit').value.trim()
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';
    statusMsg.textContent = '';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        // text/plain avoids a CORS preflight against Apps Script
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.status === 'success') {
        statusMsg.textContent = data.action === 'updated'
          ? `Added to today's total for "${payload.food}."`
          : 'Entry saved.';
        statusMsg.className = 'status-msg ok';
        document.getElementById('food').value = '';
        document.getElementById('quantity').value = '';
        document.getElementById('unit').value = '';
        document.getElementById('food').focus();
        loadLedger();
      } else {
        throw new Error(data.message || 'Unknown error');
      }
    } catch (err) {
      statusMsg.textContent = 'Could not save — ' + err.message;
      statusMsg.className = 'status-msg err';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Add to ledger';
    }
  });

  function formatDateLabel(dateStr) {
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }


  const calcMacrosBtn = document.getElementById('calcMacrosBtn');
  const macrosResult = document.getElementById('macrosResult');

  calcMacrosBtn.addEventListener('click', async function () {
    const checked = Array.from(document.querySelectorAll('.day-select:checked')).map(function (cb) { return cb.value; });

    if (checked.length === 0) {
      macrosResult.innerHTML = '<div class="empty-state">Check at least one date first.</div>';
      return;
    }
    if (!API_URL) return;

    calcMacrosBtn.disabled = true;
    calcMacrosBtn.textContent = 'Calculating…';
    macrosResult.innerHTML = '<div class="loading-state">Crunching numbers…</div>';

    try {
      const res = await fetch(API_URL + '?action=macros&dates=' + encodeURIComponent(checked.join(',')));
      const data = await res.json();
      if (data.status !== 'success') throw new Error(data.message || 'Failed to calculate');

      let html = '<div class="macros-total">';
      html += '<div class="macro-row"><span>Calories</span><span>' + data.total.calories + '</span></div>';
      html += '<div class="macro-row"><span>Protein</span><span>' + data.total.protein + ' g</span></div>';
      html += '<div class="macro-row"><span>Fiber</span><span>' + data.total.fiber + ' g</span></div>';
      html += '</div>';

      if (data.missing && data.missing.length > 0) {
        html += '<div class="macros-missing">No nutrition match for: ' + data.missing.map(escapeHtml).join(', ') + '</div>';
      }
      macrosResult.innerHTML = html;
    } catch (err) {
      macrosResult.innerHTML = '<div class="empty-state">Could not calculate — ' + escapeHtml(err.message) + '</div>';
    } finally {
      calcMacrosBtn.disabled = false;
      calcMacrosBtn.textContent = 'Calculate Macros';
    }
  });

  async function loadLedger() {
    if (!API_URL) {
      ledgerContent.innerHTML = '<div class="empty-state">Connect API_URL to see saved entries here.</div>';
      return;
    }
    try {
      const res = await fetch(API_URL + '?action=list');
      const data = await res.json();
      if (data.status !== 'success') throw new Error(data.message || 'Failed to load');

      const entries = data.entries || [];
      if (entries.length === 0) {
        ledgerContent.innerHTML = '<div class="empty-state">No entries yet — your first one will show up here.</div>';
        return;
      }

      // Group by date, most recent date first
      const byDate = {};
      entries.forEach(function (en) {
        if (!byDate[en.date]) byDate[en.date] = [];
        byDate[en.date].push(en);
      });
      const dates = Object.keys(byDate).sort().reverse();

      let html = '';
        dates.forEach(function (date, idx) {
        const expanded = idx === 0;
        html += '<div class="day-group">';
        html += '<div class="day-stamp' + (expanded ? ' expanded' : '') + '" onclick="toggleDay(this)">';
        html += '<label class="day-checkbox" onclick="event.stopPropagation()">' +
                '<input type="checkbox" class="day-select" value="' + date + '"></label>';
        html += '<span class="day-label">' + formatDateLabel(date) + '</span>';
        html += '<span class="chevron">▶</span></div>';
        html += '<div class="day-entries' + (expanded ? ' expanded' : '') + '">';
        byDate[date].forEach(function (en) {
            html += '<div class="stub"><span class="food-name">' + escapeHtml(en.food) + '</span>' +
                    '<span class="qty">' + escapeHtml(String(en.quantity)) + ' ' + escapeHtml(en.unit) + '</span></div>';
        });
        html += '</div></div>';
        });
        ledgerContent.innerHTML = html;
    } catch (err) {
      ledgerContent.innerHTML = '<div class="empty-state">Could not load entries — ' + escapeHtml(err.message) + '</div>';
    }
  }

  function toggleDay(stampEl) {
    stampEl.classList.toggle('expanded');
    const entries = stampEl.nextElementSibling;
    entries.classList.toggle('expanded');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadLedger();
</script>

</body>
</html>
